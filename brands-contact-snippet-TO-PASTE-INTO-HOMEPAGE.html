<section id="projects" class="section">
  <h2>Brands</h2>
  <div class="project-grid" id="brandsGrid">

<section id="contact" class="section contact-section">
  <h2>Contact</h2>
  <p class="section-text">Available for remote UI/UX and product design work.</p>
  <div class="contact-links" id="contactLinks">
    <!-- links render here from Firebase -->
  </div>
</section>

<!-- FIREBASE (read-only). If this page already loads Firebase     -->
<!-- elsewhere, don't duplicate the SDK <script src=...> tags —    -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAEHzTjHfp7Q8q6Gt3RbV6wXVmG77PicaA",
    authDomain: "shahneilkhan-2cdb6.firebaseapp.com",
    projectId: "shahneilkhan-2cdb6",
    storageBucket: "shahneilkhan-2cdb6.firebasestorage.app",
    messagingSenderId: "227701805510",
    appId: "1:227701805510:web:a4ea839a169ad1e3f0a2c7",
    measurementId: "G-C171XM6HK6"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const bcDb = firebase.firestore();

  // Load Brands
  bcDb.collection('content').doc('brands').get().then(doc => {
    const grid = document.getElementById('brandsGrid');
    if (!doc.exists || !grid) return;
    const items = doc.data().items || [];
    grid.innerHTML = '';
    items.forEach(b => {
      if (b.comingSoon) {
        grid.innerHTML += `
          <div class="project-card soon">
            <span class="soon-badge">Coming Soon</span>
            <h3>${b.name}</h3>
            <p>${b.description}</p>
          </div>`;
      } else {
        grid.innerHTML += `
          <a href="${b.link}" target="_blank" class="project-card">
            <h3>${b.name}</h3>
            <p>${b.description}</p>
          </a>`;
      }
    });
  }).catch(err => console.error('Brands load error:', err));

  // Load Contact links
  bcDb.collection('content').doc('contact').get().then(doc => {
    const wrap = document.getElementById('contactLinks');
    if (!doc.exists || !wrap) return;
    const d = doc.data();
    let html = '';
    if (d.whatsapp) html += `<a href="${d.whatsapp}" target="_blank" class="btn-primary">WhatsApp</a>`;
    if (d.linkedin) html += `<a href="${d.linkedin}" target="_blank" class="btn-secondary">LinkedIn</a>`;
    if (d.github) html += `<a href="${d.github}" target="_blank" class="btn-secondary">GitHub</a>`;
    if (d.behance) html += `<a href="${d.behance}" target="_blank" class="btn-secondary">Behance</a>`;
    if (d.youtube) html += `<a href="${d.youtube}" target="_blank" class="btn-secondary">YouTube</a>`;
    if (d.facebook) html += `<a href="${d.facebook}" target="_blank" class="btn-secondary">Facebook</a>`;
    if (d.instagram) html += `<a href="${d.instagram}" target="_blank" class="btn-secondary">Instagram</a>`;
    if (d.twitter) html += `<a href="${d.twitter}" target="_blank" class="btn-secondary">X (Twitter)</a>`;
    if (d.tiktok) html += `<a href="${d.tiktok}" target="_blank" class="btn-secondary">TikTok</a>`;
    wrap.innerHTML = html;
  }).catch(err => console.error('Contact load error:', err));
</script>
