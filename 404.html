<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Page not found — Shah Neil Khan"
  >

  <meta name="theme-color" content="#080808">

  <title>404 — Page Not Found | Shah Neil Khan</title>

  <link rel="icon" type="image/svg+xml"
    href="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg">

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================================================
       SNK 404 PAGE
       ========================================================= */

    .error-page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 120px 24px 60px;
      text-align: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(208, 164, 92, 0.10),
          transparent 34%
        ),
        #080808;
    }

    .error-page::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );

      pointer-events: none;
    }

    .error-glow {
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background: rgba(208, 164, 92, 0.06);

      filter: blur(90px);

      pointer-events: none;
    }

    .error-content {
      position: relative;
      z-index: 2;

      width: min(760px, 100%);
    }

    .error-logo {
      width: 54px;
      height: auto;

      margin: 0 auto 30px;

      opacity: 0.92;

      filter:
        drop-shadow(
          0 0 18px rgba(208, 164, 92, 0.18)
        );
    }

    .error-code {
      margin: 0;

      font-size: clamp(7rem, 19vw, 13rem);

      line-height: 0.78;

      letter-spacing: -0.08em;

      font-weight: 800;

      color: #f2eee7;

      text-shadow:
        0 0 40px rgba(208, 164, 92, 0.08);
    }

    .error-code span {
      color: #d0a45c;
    }

    .error-eyebrow {
      margin: 38px 0 14px;

      font-size: 0.72rem;

      font-weight: 700;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: #d0a45c;
    }

    .error-title {
      margin: 0;

      font-size: clamp(1.8rem, 4vw, 3.2rem);

      line-height: 1.05;

      letter-spacing: -0.04em;

      color: #f2eee7;
    }

    .error-text {
      max-width: 560px;

      margin: 22px auto 0;

      color: rgba(242, 238, 231, 0.62);

      font-size: 1rem;

      line-height: 1.8;
    }

    .error-terminal {
      width: min(480px, 100%);

      margin: 34px auto 0;

      padding: 15px 18px;

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 12px;

      background: rgba(255,255,255,0.025);

      box-shadow:
        0 20px 70px rgba(0,0,0,0.35);

      text-align: left;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 0.78rem;

      color: rgba(242, 238, 231, 0.55);
    }

    .error-terminal .prompt {
      color: #d0a45c;
    }

    .error-terminal .command {
      color: #f2eee7;
    }

    .error-terminal .status {
      color: #73c991;
    }

    .error-actions {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 32px;
    }

    .error-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 48px;

      padding: 0 22px;

      border-radius: 999px;

      border: 1px solid rgba(255,255,255,0.12);

      color: #f2eee7;

      background: rgba(255,255,255,0.035);

      text-decoration: none;

      font-size: 0.78rem;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      transition:
        transform 220ms ease,
        border-color 220ms ease,
        background 220ms ease,
        box-shadow 220ms ease;
    }

    .error-btn:hover {
      transform: translateY(-3px);

      border-color: rgba(208,164,92,0.5);

      background: rgba(208,164,92,0.08);

      box-shadow:
        0 12px 30px rgba(208,164,92,0.08);
    }

    .error-btn.primary {
      border-color: rgba(208,164,92,0.55);

      background: #d0a45c;

      color: #111;
    }

    .error-btn.primary:hover {
      background: #e0b875;

      border-color: #e0b875;

      color: #111;
    }

    .error-footer {
      position: absolute;

      z-index: 2;

      left: 24px;
      right: 24px;
      bottom: 28px;

      display: flex;

      justify-content: center;

      color: rgba(242,238,231,0.35);

      font-size: 0.7rem;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    .error-footer strong {
      color: rgba(242,238,231,0.6);
    }


    /* =========================================================
       LIGHT MODE
       ========================================================= */

    html.light .error-page {
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(170, 120, 45, 0.10),
          transparent 34%
        ),
        #f4f1eb;
    }

    html.light .error-page::before {
      background:
        linear-gradient(
          rgba(0,0,0,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0,0,0,0.035) 1px,
          transparent 1px
        );
    }

    html.light .error-code,
    html.light .error-title {
      color: #151515;
    }

    html.light .error-text {
      color: rgba(21,21,21,0.62);
    }

    html.light .error-terminal {
      background: rgba(0,0,0,0.025);

      border-color: rgba(0,0,0,0.10);

      color: rgba(21,21,21,0.55);
    }

    html.light .error-terminal .command {
      color: #151515;
    }

    html.light .error-btn {
      color: #151515;

      border-color: rgba(0,0,0,0.12);

      background: rgba(0,0,0,0.025);
    }

    html.light .error-footer {
      color: rgba(21,21,21,0.38);
    }

    html.light .error-footer strong {
      color: rgba(21,21,21,0.62);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 640px) {

      .error-page {
        padding: 100px 20px 70px;
      }

      .error-logo {
        width: 44px;
        margin-bottom: 25px;
      }

      .error-code {
        font-size: clamp(6rem, 28vw, 9rem);
      }

      .error-eyebrow {
        margin-top: 32px;

        font-size: 0.62rem;

        letter-spacing: 0.16em;
      }

      .error-title {
        font-size: 1.75rem;
      }

      .error-text {
        font-size: 0.9rem;

        line-height: 1.7;
      }

      .error-terminal {
        font-size: 0.68rem;

        padding: 13px 14px;

        overflow-x: auto;
      }

      .error-actions {
        width: 100%;
      }

      .error-btn {
        width: 100%;

        max-width: 280px;
      }

      .error-footer {
        bottom: 20px;

        font-size: 0.58rem;
      }
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .error-btn {
        transition: none;
      }

      .error-btn:hover {
        transform: none;
      }
    }
  </style>
</head>


<body>

  <main class="error-page">

    <div class="error-glow"></div>

    <div class="error-content">

      <img
        class="error-logo"
        src="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg"
        alt="SNK"
      >

      <h1 class="error-code">
        4<span>0</span>4
      </h1>

      <p class="error-eyebrow">
        ROUTE NOT FOUND
      </p>

      <h2 class="error-title">
        This path doesn't exist.
      </h2>

      <p class="error-text">
        The page you're looking for may have moved, changed,
        or never existed. Let's get you back to something useful.
      </p>


      <div class="error-terminal" aria-label="404 status">

        <div>
          <span class="prompt">$</span>
          <span class="command">snk locate --page</span>
        </div>

        <div style="margin-top: 7px;">
          <span class="status">✓</span>
          route search completed
        </div>

        <div style="margin-top: 5px;">
          <span class="status">!</span>
          requested resource not found
        </div>

      </div>


      <div class="error-actions">

        <a
          href="./"
          class="error-btn primary"
        >
          ← Back Home
        </a>

        <a
          href="./#ecosystem"
          class="error-btn"
        >
          Explore Ecosystem
        </a>

      </div>

    </div>


    <footer class="error-footer">
      <span>
        <strong>SNK</strong>&nbsp; · &nbsp;BUILD · LEARN · CREATE
      </span>
    </footer>

  </main>


  <script>
    /*
      Keep the 404 page compatible with the main SNK
      theme preference.
    */

    (function () {

      try {

        const savedTheme =
          localStorage.getItem("snk-theme");

        if (savedTheme === "light") {
          document.documentElement.classList.add("light");
        }

      } catch (error) {
        // Ignore localStorage restrictions.
      }

    })();
  </script>

</body>
</html>
