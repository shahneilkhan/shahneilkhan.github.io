<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport" 
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="SNK Portfolio Admin Login"
  />

  <title>SNK Admin — Login</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Admin CSS -->
  <link rel="stylesheet" href="./admin.css" />

  <style>
    /* =========================================================
       SNK ADMIN LOGIN — PAGE OVERRIDES
       ========================================================= */

    :root {
      --snk-bg: #080807;
      --snk-panel: rgba(18, 17, 14, 0.92);
      --snk-panel-2: #11100d;
      --snk-border: rgba(255, 255, 255, 0.09);
      --snk-border-hover: rgba(218, 170, 82, 0.35);

      --snk-text: #f5f0e7;
      --snk-muted: #9b968c;

      --snk-gold: #d8ad58;
      --snk-gold-light: #f0cc82;

      --snk-danger: #ef7777;
      --snk-success: #72d59b;

      --snk-radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--snk-bg);
    }

    body {
      min-height: 100vh;
      margin: 0;

      font-family: "Inter", sans-serif;

      color: var(--snk-text);
      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(216, 173, 88, 0.08),
          transparent 34%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(216, 173, 88, 0.04),
          transparent 28%
        ),
        var(--snk-bg);

      overflow-x: hidden;
    }

    /* Background atmosphere */

    .snk-admin-bg {
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 90%
        );

      opacity: 0.45;
    }

    .snk-admin-glow {
      position: fixed;

      width: 460px;
      height: 460px;

      left: 50%;
      top: 40%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(216, 173, 88, 0.09),
          transparent 68%
        );

      filter: blur(20px);

      pointer-events: none;
    }

    /* Main */

    .admin-login-page {
      position: relative;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px 20px;
    }

    .admin-login-shell {
      width: 100%;
      max-width: 470px;

      position: relative;
      z-index: 2;
    }

    /* Logo */

    .admin-brand {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-bottom: 30px;

      text-align: center;
    }

    .admin-logo-wrap {
      width: 74px;
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 13px;

      border: 1px solid rgba(216, 173, 88, 0.22);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.015)
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,0.4),
        inset 0 0 30px rgba(216,173,88,0.025);
    }

    .admin-logo {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .admin-brand-name {
      margin-top: 17px;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .admin-brand-label {
      margin-top: 6px;

      color: var(--snk-muted);

      font-family: "DM Mono", monospace;
      font-size: 11px;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Card */

    .admin-login-card {
      width: 100%;

      padding: 34px;

      border: 1px solid var(--snk-border);

      border-radius: var(--snk-radius);

      background:
        linear-gradient(
          145deg,
          rgba(28, 26, 21, 0.94),
          rgba(12, 11, 9, 0.96)
        );

      box-shadow:
        0 35px 100px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.025);
    }

    .admin-card-top {
      margin-bottom: 28px;
    }

    .admin-eyebrow {
      margin: 0 0 10px;

      color: var(--snk-gold);

      font-family: "DM Mono", monospace;
      font-size: 10px;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .admin-login-title {
      margin: 0;

      color: var(--snk-text);

      font-size: clamp(27px, 5vw, 34px);
      line-height: 1.08;

      letter-spacing: -0.035em;
    }

    .admin-login-description {
      margin: 12px 0 0;

      color: var(--snk-muted);

      font-size: 14px;
      line-height: 1.7;
    }

    /* Form */

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 19px;
    }

    .admin-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-field label {
      color: #d5d0c7;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.01em;
    }

    .admin-input-wrap {
      position: relative;
    }

    .admin-input,
    .admin-password-input {
      width: 100%;

      min-height: 52px;

      padding: 0 15px;

      border: 1px solid rgba(255,255,255,0.09);

      border-radius: 13px;

      outline: none;

      color: var(--snk-text);
      background: rgba(255,255,255,0.035);

      font-family: "Inter", sans-serif;
      font-size: 14px;

      transition:
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .admin-password-input {
      padding-right: 53px;
    }

    .admin-input::placeholder,
    .admin-password-input::placeholder {
      color: #6f6b63;
    }

    .admin-input:hover,
    .admin-password-input:hover {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.045);
    }

    .admin-input:focus,
    .admin-password-input:focus {
      border-color: rgba(216, 173, 88, 0.65);

      background: rgba(216,173,88,0.035);

      box-shadow:
        0 0 0 3px rgba(216,173,88,0.08),
        0 8px 30px rgba(0,0,0,0.15);
    }

    /* Password toggle */

    .password-toggle {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 9px;

      color: #aaa49a;

      background: transparent;

      cursor: pointer;

      transition:
        color 180ms ease,
        background 180ms ease;
    }

    .password-toggle:hover {
      color: var(--snk-gold-light);

      background: rgba(216,173,88,0.08);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Login button */

    .login-button {
      position: relative;

      width: 100%;
      min-height: 54px;

      margin-top: 4px;

      border: 1px solid rgba(216,173,88,0.5);

      border-radius: 13px;

      color: #15120c;

      background:
        linear-gradient(
          135deg,
          var(--snk-gold-light),
          var(--snk-gold)
        );

      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      cursor: pointer;

      overflow: hidden;

      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .login-button::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 20%,
          rgba(255,255,255,0.35),
          transparent 80%
        );

      transform: translateX(-120%);

      transition: transform 600ms ease;
    }

    .login-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.04);

      box-shadow:
        0 14px 35px rgba(216,173,88,0.18);
    }

    .login-button:hover::before {
      transform: translateX(120%);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: 0.65;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }

    /* Message */

    .login-message {
      min-height: 20px;

      margin: 2px 0 0;

      font-family: "DM Mono", monospace;

      font-size: 11px;
      line-height: 1.6;

      text-align: center;
    }

    .login-message.error {
      color: var(--snk-danger);
    }

    .login-message.success {
      color: var(--snk-success);
    }

    .login-message.info {
      color: var(--snk-muted);
    }

    /* Forgot password */

    .admin-forgot {
      display: flex;
      justify-content: center;

      margin-top: 20px;
    }

    .admin-forgot a {
      color: #aaa49a;

      font-size: 12px;
      text-decoration: none;

      transition: color 180ms ease;
    }

    .admin-forgot a:hover {
      color: var(--snk-gold-light);
    }

    /* Back */

    .admin-back {
      display: flex;
      justify-content: center;

      margin-top: 25px;
    }

    .admin-back a {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: #88837a;

      font-family: "DM Mono", monospace;
      font-size: 10px;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      text-decoration: none;

      transition: color 180ms ease;
    }

    .admin-back a:hover {
      color: var(--snk-gold-light);
    }

    .admin-back svg {
      width: 14px;
      height: 14px;
    }

    /* Security note */

    .admin-security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      margin-top: 26px;

      color: #625e56;

      font-family: "DM Mono", monospace;
      font-size: 9px;

      letter-spacing: 0.04em;
      text-align: center;
    }

    .security-dot {
      width: 5px;
      height: 5px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--snk-success);

      box-shadow:
        0 0 10px rgba(114,213,155,0.45);
    }

    /* Loading state */

    .login-button.is-loading {
      pointer-events: none;
    }

    .login-button.is-loading .button-text {
      opacity: 0;
    }

    .login-spinner {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 19px;
      height: 19px;

      margin:
        -9.5px
        0
        0
        -9.5px;

      border:
        2px solid rgba(20,18,12,0.25);

      border-top-color: #17130c;

      border-radius: 50%;

      animation: snkSpin 700ms linear infinite;
    }

    @keyframes snkSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      .admin-login-page {
        padding: 22px 15px;
      }

      .admin-login-card {
        padding: 26px 21px;
        border-radius: 19px;
      }

      .admin-logo-wrap {
        width: 65px;
        height: 65px;
        padding: 11px;
        border-radius: 17px;
      }

      .admin-brand {
        margin-bottom: 23px;
      }

      .admin-login-title {
        font-size: 27px;
      }

      .admin-login-description {
        font-size: 13px;
      }
    }

    @media (max-width: 390px) {
      .admin-login-card {
        padding: 23px 17px;
      }

      .admin-login-title {
        font-size: 25px;
      }

      .admin-input,
      .admin-password-input,
      .login-button {
        min-height: 50px;
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="snk-admin-bg" aria-hidden="true"></div>
  <div class="snk-admin-glow" aria-hidden="true"></div>

  <main class="admin-login-page">

    <div class="admin-login-shell">

      <!-- =====================================================
           BRAND
           ===================================================== -->

      <header class="admin-brand">

        <div class="admin-logo-wrap">

          <img
            class="admin-logo"
            src="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg"
            alt="SNK"
          />

        </div>

        <div class="admin-brand-name">
          Shah Neil Khan
        </div>

        <div class="admin-brand-label">
          SNK Portfolio / Admin
        </div>

      </header>


      <!-- =====================================================
           LOGIN CARD
           ===================================================== -->

      <section class="admin-login-card">

        <div class="admin-card-top">

          <p class="admin-eyebrow">
            Secure Access
          </p>

          <h1 class="admin-login-title">
            Welcome back.
          </h1>

          <p class="admin-login-description">
            Sign in to manage your SNK portfolio content,
            projects, experience, ecosystem and site settings.
          </p>

        </div>


        <!-- ===================================================
             LOGIN FORM
             =================================================== -->

        <form
          id="loginForm"
          class="admin-form"
          autocomplete="on"
        >

          <!-- Email -->

          <div class="admin-field">

            <label for="email">
              Email address
            </label>

            <input
              id="email"
              name="email"
              class="admin-input"
              type="email"
              autocomplete="username"
              placeholder="admin@example.com"
              required
            />

          </div>


          <!-- Password -->

          <div class="admin-field">

            <label for="password">
              Password
            </label>

            <div class="admin-input-wrap">

              <input
                id="password"
                name="password"
                class="admin-password-input"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                minlength="6"
                required
              />

              <button
                id="togglePassword"
                class="password-toggle"
                type="button"
                aria-label="Show password"
                title="Show password"
              >

                <!-- Eye -->

                <svg
                  id="eyeOpen"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                  <circle cx="12" cy="12" r="2.7"></circle>
                </svg>

                <!-- Eye Off -->

                <svg
                  id="eyeClosed"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  style="display:none;"
                >
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 3.8"></path>
                  <path d="M6.2 6.3C3.9 8 2.5 12 2.5 12s3.5 7 9.5 7c1.6 0 3-.4 4.2-1"></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>

              </button>

            </div>

          </div>


          <!-- Message -->

          <p
            id="loginMessage"
            class="login-message"
            role="status"
            aria-live="polite"
          ></p>


          <!-- Login -->

          <button
            id="loginButton"
            class="login-button"
            type="submit"
          >

            <span class="button-text">
              Sign in to Admin
            </span>

            <span
              class="login-spinner"
              aria-hidden="true"
              style="display:none;"
            ></span>

          </button>

        </form>


        <!-- Forgot Password -->

        <div class="admin-forgot">

          <a href="./forgot-password.html">
            Forgot your password?
          </a>

        </div>

      </section>


      <!-- Back to Portfolio -->

      <div class="admin-back">

        <a href="../index.html">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>

          Back to portfolio

        </a>

      </div>


      <!-- Security -->

      <div class="admin-security-note">

        <span
          class="security-dot"
          aria-hidden="true"
        ></span>

        Protected by Supabase Authentication

      </div>

    </div>

  </main>


  <!-- =========================================================
       SUPABASE
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =========================================================
       ADMIN JS
       ========================================================= -->

  <script src="./admin.js"></script>


  <!-- =========================================================
       SMALL LOGIN UI HELPERS
       ========================================================= -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const password =
        document.getElementById("password");

      const toggle =
        document.getElementById("togglePassword");

      const eyeOpen =
        document.getElementById("eyeOpen");

      const eyeClosed =
        document.getElementById("eyeClosed");

      const form =
        document.getElementById("loginForm");

      const button =
        document.getElementById("loginButton");

      const spinner =
        document.querySelector(".login-spinner");


      /* -----------------------------------------------
         Password visibility
         ----------------------------------------------- */

      if (password && toggle) {

        toggle.addEventListener("click", () => {

          const isPassword =
            password.type === "password";

          password.type =
            isPassword
              ? "text"
              : "password";

          toggle.setAttribute(
            "aria-label",
            isPassword
              ? "Hide password"
              : "Show password"
          );

          toggle.setAttribute(
            "title",
            isPassword
              ? "Hide password"
              : "Show password"
          );

          if (eyeOpen) {
            eyeOpen.style.display =
              isPassword
                ? "none"
                : "block";
          }

          if (eyeClosed) {
            eyeClosed.style.display =
              isPassword
                ? "block"
                : "none";
          }

        });

      }


      /* -----------------------------------------------
         Loading state
         ----------------------------------------------- */

      if (form && button) {

        form.addEventListener(
          "submit",
          () => {

            /*
             * admin.js handles the actual Supabase
             * authentication.
             *
             * This only controls the visual state.
             */

            setTimeout(() => {

              /*
               * If authentication fails,
               * admin.js can still restore the
               * button state.
               */

              if (
                button.disabled === false
              ) {
                return;
              }

            }, 100);

          }
        );

      }


      /* -----------------------------------------------
         Enter key UX
         ----------------------------------------------- */

      if (password) {

        password.addEventListener(
          "keydown",
          (event) => {

            if (
              event.key === "Enter"
            ) {

              event.preventDefault();

              if (form) {
                form.requestSubmit();
              }

            }

          }
        );

      }

    });
  </script>

</body>
</html>
