<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SNK Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b35;
    --text: #e8eaed;
    --text-dim: #8b92a3;
    --accent: #5b8def;
    --accent-hover: #4a7ad9;
    --success: #4ade80;
    --error: #f87171;
  }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
  }

  .login-box h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .login-box .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg { font-size: 13px; margin-top: 12px; display: none; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }

  .dashboard { display: none; }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  .dash-title { font-size: 15px; font-weight: 600; }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .dash-body { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .save-bar {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    align-items: center;
    max-width: 640px;
    margin: 0 auto;
  }

  .save-status { font-size: 13px; opacity: 0; transition: opacity 0.3s ease; }
  .save-status.show { opacity: 1; }

  .save-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn:hover { background: var(--accent-hover); }
  .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>SNK Portfolio Admin</h1>
    <p class="sub">Sign in with your Firebase account to edit site content.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Your password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign in</button>
    <p class="msg error" id="loginError">Login failed. Check your email and password.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <span class="dash-title">SNK Portfolio Admin — Hero Section</span>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>

  <div class="dash-body">
    <div class="panel">
      <h2>Hero Content (Homepage)</h2>
      <div class="field">
        <label>Headline</label>
        <textarea id="heroHeadline" placeholder="e.g. Upskill Your Team with AI-Powered Training"></textarea>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="heroDesc" placeholder="Short supporting paragraph"></textarea>
      </div>
      <div class="field">
        <label>Primary button text</label>
        <input type="text" id="btn1Text" placeholder="e.g. Explore My Work">
      </div>
      <div class="field">
        <label>Primary button link</label>
        <input type="text" id="btn1Link" placeholder="e.g. #projects">
      </div>
      <div class="field">
        <label>Secondary button text</label>
        <input type="text" id="btn2Text" placeholder="e.g. Let's Talk">
      </div>
      <div class="field">
        <label>Secondary button link</label>
        <input type="text" id="btn2Link" placeholder="e.g. https://wa.me/...">
      </div>
      <div class="field">
        <label>Hero image URL</label>
        <input type="text" id="heroImage" placeholder="https://...">
      </div>
    </div>
  </div>

  <div class="save-bar">
    <span class="save-status success" id="saveStatus">Saved ✓</span>
    <button class="save-btn" id="saveBtn" onclick="saveHero()">Save changes</button>
  </div>
</div>

<!-- FIREBASE SDK (compat, simplest for plain JS) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAEHzTjHfp7Q8q6Gt3RbV6wXVmG77PicaA",
    authDomain: "shahneilkhan-2cdb6.firebaseapp.com",
    projectId: "shahneilkhan-2cdb6",
    storageBucket: "shahneilkhan-2cdb6.firebasestorage.app",
    messagingSenderId: "227701805510",
    appId: "1:227701805510:web:a4ea839a169ad1e3f0a2c7",
    measurementId: "G-C171XM6HK6"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Watch login state
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadHeroContent();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function doLogin() {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('loginError');
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    auth.signInWithEmailAndPassword(email, password)
      .catch(err => {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      });
  }

  function doLogout() {
    auth.signOut();
  }

  function loadHeroContent() {
    db.collection('content').doc('hero').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById('heroHeadline').value = data.headline || '';
        document.getElementById('heroDesc').value = data.description || '';
        document.getElementById('btn1Text').value = data.btn1Text || '';
        document.getElementById('btn1Link').value = data.btn1Link || '';
        document.getElementById('btn2Text').value = data.btn2Text || '';
        document.getElementById('btn2Link').value = data.btn2Link || '';
        document.getElementById('heroImage').value = data.imageUrl || '';
      }
    }).catch(err => console.error('Load error:', err));
  }

  function saveHero() {
    const saveBtn = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const data = {
      headline: document.getElementById('heroHeadline').value,
      description: document.getElementById('heroDesc').value,
      btn1Text: document.getElementById('btn1Text').value,
      btn1Link: document.getElementById('btn1Link').value,
      btn2Text: document.getElementById('btn2Text').value,
      btn2Link: document.getElementById('btn2Link').value,
      imageUrl: document.getElementById('heroImage').value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection('content').doc('hero').set(data)
      .then(() => {
        status.textContent = 'Saved ✓';
        status.className = 'save-status success show';
        setTimeout(() => status.classList.remove('show'), 2500);
      })
      .catch(err => {
        status.textContent = 'Error: ' + err.message;
        status.className = 'save-status error show';
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      });
  }
</script>

</body>
</html>
