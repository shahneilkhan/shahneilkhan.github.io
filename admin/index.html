<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SNK Admin — Shah Neil Khan</title>

  <meta
    name="description"
    content="SNK Portfolio Administration"
  />

  <link
    rel="icon"
    href="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./admin.css" />
</head>

<body>

  <!-- =========================
       BACKGROUND
  ========================== -->

  <div class="admin-background"></div>

  <!-- =========================
       LOGIN
  ========================== -->

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <img
          src="https://raw.githubusercontent.com/shahneilkhan/asset/main/SNK%20LOGO.svg"
          alt="SNK"
          class="login-logo"
        />

        <span class="login-badge">
          ADMIN
        </span>

      </div>

      <div class="login-heading">

        <p class="eyebrow">
          SNK PORTFOLIO SYSTEM
        </p>

        <h1>
          Welcome back.
        </h1>

        <p>
          Sign in to manage your portfolio,
          projects, experience and visual content.
        </p>

      </div>

      <!-- LOGIN FORM -->

      <form id="loginForm" class="login-form">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="admin@example.com"
          autocomplete="email"
          required
        />

        <label for="password">
          Password
        </label>

        <div class="password-field">

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Show password"
          >
            SHOW
          </button>

        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          <span>ENTER ADMIN</span>
          <span>→</span>
        </button>

        <p
          id="loginMessage"
          class="login-message"
          role="alert"
        ></p>

      </form>

      <div class="login-footer">

        <span>
          SNK / PRIVATE CONTROL
        </span>

        <a href="../index.html">
          ← Back to portfolio
        </a>

      </div>

    </section>

  </main>

  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./admin.js"></script>

</body>
</html>
