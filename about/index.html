<style>

:root{
  --bg:#050706;
  --bg2:#090c0b;
  --panel:#0c1110;
  --panel2:#101614;

  --text:#f3f5f2;
  --muted:#89918b;
  --muted2:#626b65;

  --gold:#d6ad5a;
  --gold2:#f0cc7b;

  --teal:#2bb3a3;
  --teal2:#5ed7c7;

  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.045);

  --radius:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

/* =========================================
   BACKGROUND
========================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;

  background:
    radial-gradient(
      700px 500px at 8% -10%,
      rgba(43,179,163,.13),
      transparent 65%
    ),
    radial-gradient(
      700px 500px at 100% 15%,
      rgba(214,173,90,.08),
      transparent 65%
    ),
    radial-gradient(
      800px 500px at 50% 100%,
      rgba(43,179,163,.045),
      transparent 70%
    );

  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-4;
  opacity:.035;
  pointer-events:none;

  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);

  background-size:70px 70px;

  mask-image:linear-gradient(
    to bottom,
    black,
    transparent 80%
  );
}

/* =========================================
   HEADER
========================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(5,7,6,.72);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--line);
}

nav{
  width:min(1180px,calc(100% - 40px));
  margin:auto;

  min-height:76px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;

  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;

  white-space:nowrap;
}

.logo img{
  width:30px;
  height:30px;
  object-fit:contain;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:24px;

  font-size:12px;
  color:var(--muted);
}

.navlinks a{
  position:relative;
  transition:.3s ease;
}

.navlinks a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;

  width:0;
  height:1px;

  background:var(--gold);

  transition:.3s ease;
}

.navlinks a:hover{
  color:var(--text);
}

.navlinks a:hover::after,
.navlinks a.active::after{
  width:100%;
}

.navlinks a.active{
  color:var(--gold2);
}

/* =========================================
   GLOBAL
========================================= */

.container{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
}

.mono{
  font-family:'DM Mono',monospace;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;

  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;

  color:var(--teal2);
}

.eyebrow::before{
  content:"";
  width:28px;
  height:1px;
  background:var(--teal);
}

.reveal{
  opacity:0;
  transform:translateY(25px);
  transition:
    opacity .8s ease,
    transform .8s cubic-bezier(.2,.7,.2,1);
}

.reveal.show{
  opacity:1;
  transform:none;
}

========================================= */

}

.hero-content{

.hero-scroll{

.scroll-line{

.intro-copy strong{

    linear-gradient(

.identity-card::before{

   PRINCIPLES
========================================= */

.principle::after{

  border-radius:50%;

  border:1px solid rgba(43,179,163,.12);
